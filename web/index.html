<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导师情报 Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#161a22; --line:#2a3040; --fg:#e6e9f0; --dim:#93a0b5;
          --accent:#4f9dff; --green:#34c07c; --muted:#5d6b82; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex:none}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{color:var(--accent);font-size:12px}
  #chat{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:880px;line-height:1.6;font-size:14px}
  .user{align-self:flex-end;background:var(--accent);color:#0b0e13;padding:8px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;word-break:break-word}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:14px 14px 14px 4px;width:100%}
  .tool{display:flex;align-items:flex-start;gap:6px;margin-top:6px;flex-direction:column;border-top:1px dashed var(--line);padding-top:6px;font-size:12px}
  .tool .tbar{color:var(--accent);font-weight:600}
  .tool pre{background:#0d1015;border:1px solid var(--line);padding:6px 10px;border-radius:6px;overflow:auto;max-width:100%;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#b8c2d4;margin:0}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
  td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}
  th{background:var(--panel)}
  code{background:#0d1115;border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:13px}
  pre{background:#0d1115;border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;margin:4px 0}
  blockquote{border-left:3px solid var(--accent);margin:6px 0;padding-left:10px;color:var(--accent);background:#10141c}
  a{color:var(--accent)}
  details{margin:6px 0;border:1px solid var(--line);border-radius:6px;background:#0d1115}
  details summary{cursor:pointer;padding:6px 10px;font-size:13px;color:var(--accent)}
  details .ev{padding:6px 12px;font-size:12px;color:#b8c2d4;border-top:1px solid var(--line)}
  ul,ol{margin:6px 0 6px 20px;padding:0}
  li{margin:2px 0}
  #wo{display:flex;flex:none;padding:8px 14px 16px;border-top:1px solid var(--line);background:var(--panel);gap:8px}
  #input{flex:1;background:#0d1115;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:14px;resize:none;height:44px;outline:none}
  #input:focus{border-color:var(--accent)}
  #send{background:var(--accent);border:none;color:#fff;font-weight:600;border-radius:10px;padding:0 18px;cursor:pointer}
  #send:disabled{opacity:.5}
  .loading{color:var(--accent);font-style:italic;font-size:13px}
  .er{color:#ff8a80}
</style>
</head>
<body>
<header><h1>导师情报 Agent</h1><span class="sub">找实验室 · 论文伴读 · 进组规划 · 实时监测</span></header>
<div id="chat"></div>
<div id="wo">
  <textarea id="input" placeholder="例如：看看清华有哪些做 LLM 的老师；深挖某位老师；对比几位老师；收藏这位老师…"></textarea>
  <button id="send">发送</button>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[(.+?)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderBlock(b){
  const t=b.trim(); if(!t) return '';
  // 代码块
  if(t.startsWith('```')){
    const lines=t.split('\n');
    return '<pre>'+esc(lines.slice(1, lines[lines.length-1].startsWith('```')?-1:undefined).join('\n'))+'</pre>';
  }
  // 表格
  if(/^\s*\|/.test(t)){
    const rows=t.split('\n').filter(l=>l.trim()).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    if(rows.length>=2){
      const head=rows[0], body=rows.slice(2);
      return '<table><thead><tr>'+head.map(h=>'<th>'+inlineMd(h)+'</th>').join('')+'</tr></thead><tbody>'
        +body.map(r=>r.length===head.length?'<tr>'+r.map((c,i)=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>':'').join('')+'</tbody></table>';
    }
  }
  // 引用
  if(t.startsWith('>')){
    const lines=t.split('\n').map(l=>l.replace(/^>\s?/,''));
    const content=lines.map(l=>esc(l)).join('<br>');
    return '<blockquote>'+content+'</blockquote>';
  }
  // 标题
  if(/^#{1,4}\s/.test(t)){ const m=t.match(/^(#{1,4})\s+(.*)/); return '<h'+(m[1].length)+'>'+inlineMd(m[2])+'</h'+(m[1].length)+'>'; }
  // 列表
  if(/^\s*[-*]\s+/m.test(t) && !t.includes('\n\n')){
    return '<ul>'+t.split('\n').filter(l=>l.trim()).map(l=>'<li>'+inlineMd(l.replace(/^\s*[-*]\s+/,''))+'</li>').join('')+'</ul>';
  }
  if(/^\s*\d+\.\s+/m.test(t) && !t.includes('\n\n')){
    return '<ol>'+t.split('\n').filter(l=>l.trim()).map(l=>'<li>'+inlineMd(l.replace(/^\s*\d+\.\s+/,''))+'</li>').join('')+'</ol>';
  }
  // 多行普通文本：行内加 <br>
  const paras=t.split('\n\n');
  return paras.map(p=>{
    const ls=p.split('\n').map(inlineMd).join('<br>');
    return '<p>'+ls+'</p>';
  }).join('');
}
function renderMd(md){
  return md.split(/\n\s*\n/).map(renderBlock).join('');
}
const chat=document.getElementById('chat'), inp=document.getElementById('input'), send=document.getElementById('send');
let messages=[];
function scroll(){ chat.scrollTop=chat.scrollHeight; }
function addBot(md, tools){
  const div=document.createElement('div'); div.className='msg bot';
  div.innerHTML=renderMd(md);
  if(tools && tools.length){
    const tdiv=document.createElement('div'); tdiv.className='tool';
    tools.forEach(t=>{
      const sp=document.createElement('div');
      sp.innerHTML='<span class="tbar">🔧 '+esc(t.name)+'</span>';
      if(t.preview){ const pre=document.createElement('pre'); pre.textContent=t.preview.slice(0,200); sp.appendChild(pre); }
      tdiv.appendChild(sp);
    });
    div.appendChild(tdiv);
  }
  chat.appendChild(div); scroll();
}
async function sendMsg(){
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; send.disabled=true;
  const u=document.createElement('div'); u.className='msg user'; u.textContent=text; chat.appendChild(u); scroll();
  const ld=document.createElement('div'); ld.className='loading'; ld.textContent='思考中…（可能调用工具）'; chat.appendChild(ld); scroll();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,messages})});
    const data=await r.json();
    ld.remove();
    if(data.error){ addBot('<span class="er">⚠️ 出错：</span>'+esc(data.error)); return; }
    messages=data.messages;
    addBot(data.reply, data.tools);
  }catch(e){ ld.remove(); addBot('<span class="er">⚠️ 请求失败：</span>'+esc(String(e))); }
  finally{ send.disabled=false; inp.focus(); }
}
function sendClick(){ send && send(); }
send.addEventListener('click', send);
inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
inp.focus();
</script>
</body>
</html>
